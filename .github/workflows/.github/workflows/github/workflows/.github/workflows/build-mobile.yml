name: Build Qora EPOS Back Office Android app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      - name: Build web bundle
        env:
          QORA_SERVER_URL: ${{ secrets.QORA_SERVER_URL }}
        run: npm run build
      - name: Add Android platform (first run only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Sync web build into Android project
        env:
          QORA_SERVER_URL: ${{ secrets.QORA_SERVER_URL }}
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: |
          mkdir -p release-mobile
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release-mobile/Qora-EPOS-BackOffice.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qora-epos-android
          path: release-mobile/*.apk
          if-no-files-found: error
      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-mobile/*.apk
