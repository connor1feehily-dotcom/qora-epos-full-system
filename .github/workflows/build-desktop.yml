name: Build Qora EPOS desktop installer

# Builds the Windows installer (.exe) and Linux AppImage for Qora EPOS.
# Triggered on push to main, on tags like v1.0.0, or manually from the
# GitHub Actions tab. Artifacts are attached to the workflow run AND, for
# tag pushes, to a GitHub Release so Valerie can just click "Download".

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            artifact_glob: 'release/*.exe'
            artifact_name: qora-epos-windows
          - os: ubuntu-latest
            target: linux
            artifact_glob: 'release/*.AppImage'
            artifact_name: qora-epos-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web + server bundle
        run: npm run build

      - name: Package desktop app (${{ matrix.target }})
        shell: bash
        run: npx electron-builder --${{ matrix.target }} --projectDir electron

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_glob }}
